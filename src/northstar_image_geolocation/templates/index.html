<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NORTHSTAR — Image Geolocation & Solar Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(18, 26, 43, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #f59e0b;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            background-image: radial-gradient(circle at 10% 10%, rgba(245, 158, 11, 0.1) 0%, transparent 40%);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo { display: flex; align-items: center; gap: 0.75rem; }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .logo-title { font-size: 1.3rem; font-weight: 700; }
        .logo-subtitle { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

        .layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            flex: 1;
        }

        .map-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            min-height: 500px;
        }

        #map { width: 100%; height: 100%; min-height: 500px; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-label { color: var(--text-muted); }
        .info-val { font-weight: 600; text-align: right; }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">🧭</div>
            <div>
                <div class="logo-title">NORTHSTAR</div>
                <div class="logo-subtitle">Géolocalisation d'Images par Ombres & Calcul Solaire</div>
            </div>
        </div>
        <div class="badge">SOLAR GEOLOCATION ENGINE</div>
    </header>

    <div class="layout">
        <div class="map-wrapper">
            <div id="map"></div>
        </div>

        <div class="card">
            <div class="card-title">Résultats de Géolocalisation</div>
            <div class="info-row"><span class="info-label">Lieu Estimé</span><span class="info-val" id="gLoc">-</span></div>
            <div class="info-row"><span class="info-label">Coordonnées (GPS)</span><span class="info-val" id="gCoords">-</span></div>
            <div class="info-row"><span class="info-label">Azimut Solaire</span><span class="info-val" id="gAzimuth" style="color:#fbbf24;">-</span></div>
            <div class="info-row"><span class="info-label">Élévation du Soleil</span><span class="info-val" id="gElevation">-</span></div>
            <div class="info-row"><span class="info-label">Rayon de Confiance</span><span class="info-val" id="gRadius">-</span></div>
        </div>
    </div>

    <script>
        let map = L.map('map').setView([48.8584, 2.2945], 15);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: 'Northstar Solar Engine'
        }).addTo(map);

        async function analyserGeolocalisation() {
            try {
                const response = await fetch('/api/v1/geolocate?image_path=photo_inconnue.jpg');
                const contract = await response.json();
                const r = contract.result;

                document.getElementById('gLoc').textContent = r.estimated_location || '-';
                document.getElementById('gCoords').textContent = `${r.estimated_lat}, ${r.estimated_lon}`;
                document.getElementById('gAzimuth').textContent = `${r.sun_azimuth_deg}°`;
                document.getElementById('gElevation').textContent = `${r.sun_elevation_deg}°`;
                document.getElementById('gRadius').textContent = `${r.radius_km * 1000} m`;

                const marker = L.marker([r.estimated_lat, r.estimated_lon]).addTo(map);
                L.circle([r.estimated_lat, r.estimated_lon], {
                    radius: r.radius_km * 1000,
                    color: '#f59e0b',
                    fillColor: '#f59e0b',
                    fillOpacity: 0.15
                }).addTo(map);

                marker.bindPopup(`<strong>🧭 ${r.estimated_location}</strong><br/>Azimut Soleil: ${r.sun_azimuth_deg}°`).openPopup();

            } catch (err) {
                console.error("Erreur lors de la géolocalisation Northstar.");
            }
        }

        window.onload = analyserGeolocalisation;
    </script>
</body>
</html>
